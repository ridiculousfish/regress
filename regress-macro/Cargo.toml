[package]
name = "regress-macro"
version = "0.1.0"
authors = ["ridiculousfish <corydoras@ridiculousfish.com>"]
description = "regex! proc-macro: regress regexes compiled to Rust ahead of time"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ridiculousfish/regress"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
# Exact-version pin: the generated code links against `regress::__codegen`,
# which is doc(hidden) and semver-exempt — emitter and runtime must agree.
regress = { path = "..", version = "=0.11.1", features = ["codegen"] }
syn = { version = "2", default-features = false, features = ["parsing", "proc-macro", "printing"] }
proc-macro2 = "1"

[features]
# Forwards to regress's tdfa-jit backend, for the `tdfa-jit` column in the
# `aot_bench` example (a sibling comparison, not exercised by regex! itself).
tdfa-jit = ["regress/tdfa-jit"]

[dev-dependencies]
# The integration tests link generated code against the same regress.
regress = { path = "..", version = "=0.11.1", features = ["codegen"] }
trybuild = "1"
# Reference engine for the `aot_bench` example only; dev-only, path points
# outside the repo so its own cargo workspace doesn't collide with ours (same
# pattern as regress's own dev-dependency on this vendored clone).
regex = { path = "../../regress-vendor-regex" }
